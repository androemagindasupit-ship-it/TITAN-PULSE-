name: Build TITAN PULSE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        shell: bash
        run: |
          npm ci

      - name: Verify TypeScript
        shell: bash
        run: |
          node -e "require('typescript'); console.log('TypeScript OK')"

      - name: Verify project
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.ts
          test -f www/index.html
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          echo "Project verification OK"

      - name: Sync Capacitor
        shell: bash
        run: |
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Fix Gradle wrapper
        shell: bash
        run: |
          chmod +x android/gradlew
          git update-index --chmod=+x android/gradlew || true

      - name: Clean Android build
        working-directory: android
        shell: bash
        run: |
          gradle clean --no-daemon

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Prepare APK artifact
        shell: bash
        run: |
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "TITAN PULSE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PULSE-APK
          path: "TITAN PULSE.apk"
          if-no-files-found: error
          retention-days: 7
