name: Build TITAN PULSE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools"

          if sdkmanager --install "platforms;android-36" "build-tools;36.0.0"; then
            echo "Using Android 36"
          else
            echo "Android 36 unavailable, using Android 35"
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

            python3 - <<'PY'
from pathlib import Path

p = Path("android/variables.gradle")
s = p.read_text()

s = s.replace("compileSdkVersion = 36", "compileSdkVersion = 35")
s = s.replace("targetSdkVersion = 36", "targetSdkVersion = 35")

p.write_text(s)
PY
          fi

      - name: Install project dependencies
        shell: bash
        run: |
          npm ci

      - name: Verify project
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.ts
          test -f www/index.html
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/variables.gradle
          node -e "require('typescript'); console.log('TypeScript OK')"

      - name: Sync Capacitor
        shell: bash
        run: |
          npx cap sync android

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: true

      - name: Fix executable permissions
        shell: bash
        run: |
          chmod +x android/gradlew || true
          git update-index --chmod=+x android/gradlew || true

      - name: Clean Android
        working-directory: android
        shell: bash
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "========== APK SUCCESS =========="
          ls -lh "$APK"
          file "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "TITAN PULSE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PULSE-APK
          path: "TITAN PULSE.apk"
          if-no-files-found: error
          retention-days: 7
