name: Build TITAN PULSE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.13'
  ANDROID_PLATFORM: 'android-35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Install TypeScript and project dependencies
        shell: bash
        run: |
          npm ci

      - name: Verify required files
        shell: bash
        run: |
          test -f capacitor.config.ts
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f www/index.html

      - name: Sync Capacitor
        shell: bash
        run: |
          npx cap sync android

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "TITAN PULSE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PULSE-APK
          path: "TITAN PULSE.apk"
          if-no-files-found: error
          retention-days: 7
