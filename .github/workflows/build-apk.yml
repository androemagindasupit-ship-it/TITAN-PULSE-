name: Build TITAN PULSE APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.13'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -u

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install "platform-tools"

          if sdkmanager --install "platforms;android-36" "build-tools;36.0.0"; then
            echo "ANDROID_API=36" >> "$GITHUB_ENV"
            echo "ANDROID_BUILD_TOOLS=36.0.0" >> "$GITHUB_ENV"
          else
            echo "Android 36 unavailable; falling back to Android 35"

            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

            echo "ANDROID_API=35" >> "$GITHUB_ENV"
            echo "ANDROID_BUILD_TOOLS=35.0.0" >> "$GITHUB_ENV"

            python3 - <<'PY'
from pathlib import Path

p = Path("android/variables.gradle")
s = p.read_text()

s = s.replace(
    "compileSdkVersion = 36",
    "compileSdkVersion = 35"
).replace(
    "targetSdkVersion = 36",
    "targetSdkVersion = 35"
)

p.write_text(s)
PY
          fi

          echo "Android API selected: ${ANDROID_API:-unknown}"
          echo "Build tools selected: ${ANDROID_BUILD_TOOLS:-unknown}"

      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          chmod +x android/gradlew
          git update-index --chmod=+x android/gradlew || true

      - name: Ensure TypeScript exists
        shell: bash
        run: |
          npm install --save-dev typescript
          node -e "require('typescript'); console.log('TypeScript OK')"

      - name: Install web dependencies
        shell: bash
        run: |
          npm ci

      - name: Verify project structure
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.ts
          test -f www/index.html
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/variables.gradle
          echo "Project structure OK"

      - name: Sync Capacitor Android
        shell: bash
        run: |
          npx cap sync android

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false

      - name: Verify toolchain
        shell: bash
        run: |
          java -version
          node --version
          npm --version
          sdkmanager --version
          gradle --version

      - name: Clean previous Android outputs
        working-directory: android
        shell: bash
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify generated APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK found:"
          ls -lh "$APK"

          file "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "TITAN PULSE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-PULSE-APK
          path: "TITAN PULSE.apk"
          if-no-files-found: error
          retention-days: 7
